<!DOCTYPE html>
<html ng-app="fishconfig">

<head>
    <meta http-equiv="Content-type" content="text/html;charset=UTF-8">
    <title>fish shell configuration</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="stylesheet" type="text/css" href="fishconfig.css" />
    <link rel="stylesheet" type="text/css" media="print" href="fishconfig_print.css">
    <script type="text/javascript" src="js/colour_variables.js" defer></script>
    <script type="text/javascript" src="js/colorutils.js" defer></script>
    <script type="text/javascript" src="js/main.js" defer></script>
    <script type="text/javascript" src="js/alpine.js" defer></script>
</head>

<!-- TODO check that every x-for has a :key binding -->
<!-- TODO check that every template has single child -->
<!-- TODO try to reduce depth by either splitting routes or eliminating redundant wrappers -->

<body id="ancestor" x-data="{ currentTab: 'colors' }">
    <main id="parent">
        <div id="tab_parent">
            <a :class="{'tab': true, 'selected_tab': currentTab =='colors'}" id="tab_colors"
                @click="currentTab = 'colors'">colors</a>
            <a :class="{'tab': true, 'selected_tab': currentTab == 'prompt'}" id="tab_prompt"
                @click="currentTab = 'prompt'">prompt</a>
            <a :class="{'tab': true, 'selected_tab': currentTab == 'functions'}" id="tab_functions"
                @click="currentTab = 'functions'">functions</a>
            <a :class="{'tab': true, 'selected_tab': currentTab == 'variables'}" id="tab_variables"
                @click="currentTab = 'variables'">variables</a>
            <a :class="{'tab': true, 'selected_tab': currentTab == 'history'}" id="tab_history"
                @click="currentTab = 'history'">history</a>
            <a :class="{'tab': true, 'selected_tab': currentTab == 'bindings'}" id="tab_bindings"
                @click="currentTab = 'bindings'"><span class="print_only">fish shell </span>bindings</a>
        </div>
        <div id="tab_contents">
            <template x-if="currentTab === 'colors'" x-data="colors">
                <div class="colour_panes" tabindex="-1" x-ref="panes" :style="paneSizes" @keydown="onPaneKey($event)">
                    <!-- The edges between the panes.  Each lies on a gap the grid leaves, and each
                         corner where a column edge meets a row edge drags both; where they are is
                         measured from the panes, so the layout states them. -->
                    <div class="colour_sashes" x-ref="sashes">
                        <template x-for="sash in sashes" :key="sash.edge.id">
                            <div class="colour_sash" :style="sash.style"
                                @pointerdown.prevent.stop="startSashDrag(sash, $event)"></div>
                        </template>
                    </div>
                    <!-- The sample: fish source classified by the highlighting pass itself, with
                         the style each piece resolves to.  A click picks a run; the scopes that
                         colour it appear in the rail beside it.  Nothing is marked until
                         then. -->
                    <div class="colour_pane colour_pane_sample" tabindex="-1" x-ref="samplePane"
                        :class="{colour_sample_sized: '--sample-row' in paneSizes}"
                        @focus="pane = 'sample'"
                        :style="{'background-color': actualTerminalBackgroundColor, 'color': defaultTextColour()}">
                        <div class="colour_sample_title">
                            <span x-text="selectedColorScheme.name_with_color_theme"></span>
                            <span class="colour_sample_simulate">Simulate background color</span>
                            <template x-for="color in sampleTerminalBackgroundColors">
                                <label class="colour_sample_background_choice" :style="{'background-color': color}">
                                    <input type="radio" :value="color" x-model="overriddenTerminalBackgroundColor" hidden
                                        :title="'Preview with this background color.\n\nfish cannot change the background color of your terminal. Refer to your terminal settings to set its background color.'">
                                    </input>
                                </label>
                            </template>
                        </div>
                        <div class="colour_sample_rows" x-ref="sampleRows">
                            <template x-for="(piece, pieceIndex) in colourSample" :key="pieceIndex">
                                <span class="colour_sample_piece" :style="styleForPiece(piece)" @click="pickPiece(pieceIndex)"
                                    :data-piece-index="pieceIndex" x-text="piece.text"></span>
                            </template>
                        </div>
                    </div>
                    <!-- The scopes that colour the picked run, most specific first: the run's
                         own scope, the chain it resolves through, the scopes that enclose it,
                         and the root, each label in the style its own variable renders.  A
                         scope the theme leaves empty has a dim label. -->
                    <div class="colour_pane colour_pane_rail" x-ref="specificity" tabindex="-1"
                        @focus="pane = 'rail'" @click="focusPane('rail')"
                        :style="{'background-color': actualTerminalBackgroundColor}">
                        <template x-if="pickedStops.length === 0">
                            <div class="colour_pane_hint" :style="{'color': defaultTextColour()}">
                                Pick a run in the sample, or a variable in the list below, to choose
                                the scope a colour applies to.
                            </div>
                        </template>
                        <template x-if="pickedStops.length > 0">
                            <div class="colour_specificity_rail">
                                <div class="colour_specificity_graphic">^</div>
                                <template x-for="(stop, stopIndex) in pickedStops" :key="stopIndex">
                                    <div>
                                        <div class="colour_specificity_stop"
                                            :class="{colour_specificity_selected: selectedStopIndex == stopIndex, colour_specificity_unset: !stopIsSet(stop)}"
                                            :title="stop.variable" @click="selectRailStop(stopIndex)"
                                            @dblclick="revealVariableInSample(stop.variable)"
                                            @mouseenter="hoverRailStop(stopIndex)"
                                            @mouseleave="clearHoveredRailStop()"><span
                                                class="colour_specificity_indicator"
                                                x-text="selectedStopIndex == stopIndex ? '&gt; ' : '  '"></span><span
                                                class="colour_specificity_bullet"
                                                x-text="selectedStopIndex == stopIndex ? '* ' : 'o '"></span><span
                                                class="colour_specificity_label"
                                                :style="effectiveStyleOf(stop.variable)"
                                                x-text="'[' + stop.path + ']'"></span></div>
                                        <div class="colour_specificity_graphic"
                                            x-show="stopIndex &lt; pickedStops.length - 1">|</div>
                                    </div>
                                </template>
                                <div class="colour_specificity_graphic">v</div>
                            </div>
                        </template>
                    </div>
                    <!-- The variables the sample cannot show — the enclosing scopes, the family
                         fallbacks and the overlays — and every other one, so all of them are
                         reachable. -->
                    <div class="colour_pane colour_pane_variables" tabindex="-1" x-ref="variablesPane"
                        :style="{'background-color': actualTerminalBackgroundColor}">
                        <div class="colour_variable_list" x-ref="variableList">
                            <template x-for="variable in colourVariables" :key="variable.variable">
                                <div class="colour_variable_row"
                                    :class="{cs_editing: selectedColorSetting == variable.variable}"
                                    :style="effectiveStyleOf(variable.variable)"
                                    :data-variable="variable.variable"
                                    @click="selectVariable(variable.variable)"
                                    @dblclick="revealVariableInSample(variable.variable)"
                                    @mouseenter="hoverVariable(variable.variable)"
                                    @mouseleave="clearHoveredVariable()" x-text="variable.description"></div>
                            </template>
                        </div>
                    </div>
                    <!-- The line the theme file has for the scope, live: coloured by the pass the
                         sample is coloured by, and read back into the picker when the editor
                         loses the focus.  A scope the theme does not set has no line, and the
                         editor over it is empty. -->
                    <div class="colour_pane colour_pane_line" x-ref="statementPane" @focusin="pane = 'statement'"
                        @click="focusPane('statement')"
                        :style="{'background-color': actualTerminalBackgroundColor}">
                        <div class="colour_statement_comment" :style="styleForPath('comment')"><span class="colour_statement_prompt" x-ref="statementPrompt">&#10095; </span><span x-text="commentLine()"></span></div>
                        <div class="colour_statement_editor" :style="statementIndentStyle()">
                            <pre class="colour_statement_view"><template x-for="(run, runIndex) in statementViewPieces()" :key="runIndex"><span :style="run.piece ? styleForPiece(run.piece) : {'color': defaultTextColour()}" x-text="run.text"></span></template></pre>
                            <textarea class="colour_statement_input" x-ref="statementInput" x-model="themeStatement"
                                spellcheck="false" rows="1" placeholder="set --global ..."
                                :style="{'caret-color': defaultTextColour()}"
                                @focus="pane = 'statement'" @input="onStatementInput()"
                                @blur="applyThemeStatement()" @keydown.enter.prevent="$el.blur()"></textarea>
                        </div>
                    </div>
                    <!-- The style the scope has and the colours a field takes.  The style pane
                         is the narrow column: the style decides the field, and the colour pane
                         is where a colour is found. -->
                    <div class="colour_bottom" x-ref="bottomPane">
                        <div class="colour_pane colour_pane_style" x-ref="stylePane" tabindex="-1"
                            @focus="pane = 'style'; styleRow = 'fields'" @click="focusPane('style')"
                            :style="{'background-color': actualTerminalBackgroundColor}">
                            <div class="colour_style_fields">
                                <template x-for="field in styleFields()" :key="field">
                                    <div class="colour_style_field" :style="fieldButtonStyle(field)"
                                        @click="selectField(field)" x-text="fieldLabel(field)"></div>
                                </template>
                            </div>
                            <div class="colour_style_flags" x-show="flagRowsShown()">
                                <template x-for="(flag, flagIndex) in flagRows()" :key="flag">
                                    <div class="colour_style_flag" :style="flagRowStyle(flag, flagIndex)"
                                        @click="toggleFlag(flag)"><span class="colour_style_flag_bullet"
                                            x-text="selectedFlag(flag) ? '* ' : 'o '"></span><span
                                            class="colour_style_flag_title" :style="flagTitleStyle(flag)"
                                            x-text="flagTitle(flag)"></span></div>
                                </template>
                            </div>
                        </div>
                        <!-- The colours a field takes: the cell that clears the scope, the swatch
                             that opens a colour picker for the field the style pane writes, the
                             value's hex beside it, the terminal's sixteen, and the 256-colour
                             table. -->
                        <div class="colour_pane colour_pane_colours" x-ref="colourPane" tabindex="-1"
                            @focus="pane = 'colour'" @click="focusPane('colour')"
                            :style="{'background-color': actualTerminalBackgroundColor}">
                            <template x-for="(row, rowIndex) in colourRows()" :key="rowIndex">
                                <div class="colour_colour_row">
                                    <template x-for="(cell, columnIndex) in row" :key="columnIndex">
                                        <div class="colour_colour_cell"
                                            :class="{
                                                colour_colour_unset: cell.kind === 'unset',
                                                colour_colour_swatch_cell: cell.kind === 'swatch',
                                                colour_colour_hex: cell.kind === 'hex',
                                                colour_colour_palette: cell.kind === 'colour',
                                            }"
                                            :style="colourCellStyle(cell, rowIndex, columnIndex)"
                                            :title="cell.kind === 'colour' ? cell.colour : (cell.kind === 'swatch' ? 'Pick a colour for ' + fieldLetters(editingField) : (cell.kind === 'unset' ? 'clear the scope' : selectedFieldHex()))"
                                            @click="activateColourCell(cell)">
                                            <template x-if="cell.kind === 'unset'"><span>X</span></template>
                                            <template x-if="cell.kind === 'swatch'"><input type="color"
                                                    x-ref="colourSwatch" class="colour_colour_input"
                                                    :value="colourSwatchValue()" @input="liveSwatchColour($event)"
                                                    @change="commitSwatchColour()"></template>
                                            <template x-if="cell.kind === 'hex'"><span
                                                    x-text="selectedFieldHex() || 'unset'"></span></template>
                                        </div>
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                    <!-- What the page writes, and the themes it can write instead.  The strip is
                         as tall as its text, so the edges above and below it move the nearest
                         row that can be sized. -->
                    <div class="colour_footer" x-ref="footerPane"
                        :style="{'background-color': actualTerminalBackgroundColor}">
                        <span class="colour_footer_message" :style="refusalStyle()" x-text="themeSaveMessage"></span>
                        <button class="save_button" :style="{'color': defaultTextColour()}"
                            x-show="showSaveButton" @click="setTheme" x-text="saveThemeButtonTitle"></button>
                    </div>
                    <div class="colour_preview_title">Preview a theme below:</div>
                    <div class="color_scheme_choices_scrollview">
                        <div class="color_scheme_choices_list">
                            <template x-for="colorScheme in colorSchemes">
                                <div class="color_scheme_choice_container"
                                    @click="changeSelectedColorScheme(colorScheme)">
                                    <div class="color_scheme_choice_label">
                                        <!-- This click/clickBubble nonsense is so that we can have a separate URL inside a parent with an onClick handler -->
                                        <span x-text="colorScheme.name_with_color_themes"></span>
                                        <a x-show="colorScheme.url" style="text-decoration: none; color: inherit;"
                                            :href="colorScheme.url">&#10138;</a>
                                    </div>
                                    <div class="colorpicker_text_sample_tight"
                                        :style="{'background-color': default_color_scheme(colorScheme).preferred_background}">
                                        <span
                                            :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_command)}">/bright/vixens</span>
                                        <span :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_param)}">jump</span>
                                        <span :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_end)}">|</span>
                                        <span :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_command)}">dozy</span>
                                        <span :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_quote)}"> "fowl" </span>
                                        <span :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_redirection)}">&gt;
                                            quack</span>
                                        <span :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_end)}">&</span>
                                        <br>
                                        <span :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_command)}">echo</span>
                                        <span :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_error)}">'</span><span
                                            :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_quote)}">Errors are the
                                            portals to discovery</span>
                                        <br>
                                        <span :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_comment)}"># This is a
                                            comment</span>
                                        <br>
                                        <span :style="{'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_command)}">Th</span><span
                                            class="fake_cursor"><span style="visibility: hidden">i</span></span><span
                                            :style="{ 'color': interpret_color(default_color_scheme(colorScheme).colors.fish_color_autosuggestion)}">s is an
                                            autosuggestion</span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Investigate potential race condition with selectedPrompt (e.g. replace x-if with x-show) -->
            <template x-if="currentTab === 'prompt'" x-data="prompt">
                <div class="height_limiter">
                    <!-- The first 'sample' prompt is the current one; the remainders are samples. This ought to be cleaned up. -->
                    <div class="current_prompt" style="min-height: 7.5em;"
                        :style="{'background-color': actualTerminalBackgroundColor}">
                        <div class="prompt_demo_choice_label" style="color: #FFF;" x-text="selectedPrompt.name"></div>
                        <div style='display: flex'>
                            <div x-html='selectedPrompt.demo' style='flex-grow: 1' class="prompt_demo unbordered"></div>
                            <template x-if="selectedPrompt.right">
                                <div title="right prompt for {{selectedPrompt.name }}" x-html='selectedPrompt.right'
                                    class="prompt_demo unbordered" @click="selectPrompt(selectedPrompt)">
                                </div>
                            </template>
                        </div>
                        <div style="position: absolute; right: 5px; bottom: 5px;">
                            <button class="save_button" x-show="showSaveButton" style="color: #CCC" @click="setPrompt()"
                                x-text="savePromptButtonTitle"></button>
                        </div>
                    </div>
                    <div style="margin: 10px 15px 7px 15px; padding-bottom: 10px; border-bottom: solid 1px #999">Preview
                        a
                        prompt below:</div>
                    <div class="prompt_choices_scrollview">
                        <div class="prompt_choices_list">
                            <template x-for="p in samplePrompts" :key="p.name">
                                <div>
                                    <div class="prompt_demo_choice_label" x-text="p.name"></div>
                                    <template x-if="p.right">
                                        <div style="display: flex;">
                                            <div x-html="p.demo" class="prompt_demo" style="flex-grow: 1"
                                                @click="selectPrompt(p)"></div>
                                            <div title="right prompt for {{p.name}}" x-html="p.right || ''"
                                                class="prompt_demo" @click="selectPrompt(p)"></div>
                                        </div>
                                    </template>
                                    <template x-if="!p.right">
                                        <div x-html="p.demo" class="prompt_demo" @click="selectPrompt(p)">
                                    </template>
                                </div>
                            </template>
                        </div>
                    </div>
                </div>
            </template>

            <template x-if="currentTab === 'functions'" x-data="functions">
                <div class="function_tab">
                    <div class="function-list">
                        <template x-for="func in functions">
                            <!-- TODO use ul/li -->
                            <div>
                                <div id="master_{{func}}"
                                    :class="{'master_element': true, 'selected_master_elem': func == selectedFunction }"
                                    @click="selectFunction(func)">
                                    <span class="master_element_text" x-text="func"></span>
                                </div>
                            </div>
                        </template>
                    </div>
                    <div class="function-body">
                        <div class="detail_function" x-html="functionDefinition"></div>
                    </div>
                </div>

            </template>

            <template x-if="currentTab === 'variables'" x-data="variables">
                <div>
                    <div id="table_filter_container">
                        <input id="table_filter_text_box" class="filter_text_box text_box_transient"
                            placeholder="Filter" x-model="query">
                    </div>
                    <table class="data_table">
                        <template x-for="v in filteredVars" :key="v.name">
                            <tr class="data_table_row" tabindex="0" x-data="{ focused: false }"
                                @focusin="focused = true" @focusout="focused = false">
                                <td class="data_table_cell no_overflow" style="text-align: right; padding-right: 30px;"
                                    x-text="v.name"></td>
                                <!-- Small hack to select/unselect variables -->
                                <td :class="{ 'data_table_cell': true, 'no_overflow': !focused }"
                                    style="text-align: left; padding-right: 30px;" x-text="v.value"></td>
                            </tr>
                        </template>
                    </table>
                </div>
            </template>

            <template x-if="currentTab === 'history'" x-data="history">
                <div>
                    <div id="table_filter_container">
                        <table class="paginator">
                            <tr>
                                <td class="prev">
                                    <button type="button" @click="prevPage" :disabled="currentPage == 0">« Prev</button>
                                </td>
                                <td class="desc" x-text="currentPageDescription"></td>
                                <td class="next">
                                    <button type="button" @click="nextPage"
                                        :disabled="(currentPage+1)*itemsPerPage >= filteredItems.length">Next »</button>
                                </td>
                            </tr>

                        </table>

                        <input id="table_filter_text_box" class="filter_text_box text_box_transient"
                            placeholder="Filter" x-model.debounce="query">
                    </div>
                    <table class="data_table">
                        <!-- TODO maybe use history index as keys here? -->
                        <template
                            x-for="item in filteredItems.slice(currentPage * itemsPerPage, (currentPage+1) * itemsPerPage)"
                            :key="item">
                            <tr>
                                <td :class="{'history_text': true, 'no_overflow': selectedItems.indexOf(item) < 0}"
                                    @click="selectItem(item)" x-text="item"></td>
                                <td class="history_delete">
                                    <button type="button" class="delete_button" title="Delete"
                                        @click="deleteHistoryItem(item)">&times;</button>
                                </td>
                            </tr>
                        </template>
                    </table>
                </div>
            </template>


            <template x-if="currentTab === 'bindings'" x-data="bindings"
                x-init="bindings = await (await fetch('bindings/')).json()">
                <div>
                    <div id="table_filter_container">
                        <input id="table_filter_text_box" class="filter_text_box text_box_transient"
                            placeholder="Filter" x-model="query">
                    </div>
                    <table class="data_table">
                        <template x-for="b in filteredBindings" :key="b.command">
                            <tr class="data_table_row" tabindex="0" x-data="{ focused: false }"
                                @focusin="focused = true" @focusout="focused = false">
                                <td :class="{ 'data_table_cell': true, 'no_overflow': !focused }"
                                    style="text-align: right; padding-right: 30px;" x-text="b.command"></td>
                                <!-- Small hack to select/unselect variables -->
                                <td :class="{ 'data_table_cell': true, 'no_overflow': !focused }"
                                    style="text-align: left; padding-right: 30px;">
                                    <template x-for="variety in b.bindings" :key="variety.readable_binding">
                                        <div>
                                            <span x-text="variety.readable_binding"></span>
                                            <template x-for="raw in variety.raw_bindings" :key="raw">
                                                <div class="raw_binding" x-show="focused" x-text="raw"></div>
                                            </template>
                                        </div>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </table>
                </div>
            </template>
        </div>
    </main>
</body>

</html>
